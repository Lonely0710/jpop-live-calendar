    enabled: false
    interval: 6h
    note: 仅厂牌新闻，可能缺少完整的 LIVE 日程与抽选；官方站维护时可启用。
    note_ja: 'レーベルのニュースのみのため、LIVE 日程や抽選の情報が欠けることがあります。公式サイトのメンテナンス中に有効にしてください。'
