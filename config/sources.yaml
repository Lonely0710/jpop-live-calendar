# 头像：都是免账号的公开接口，按艺人名与别名查找，每秒至多 1 次请求。照片优先，
#   封面兜底——Apple 的公开接口不提供艺人照片，只有专辑封面。
#   deezer（默认）  依次试 Deezer（api.deezer.com，艺人照片）→ QQ 音乐（c.y.qq.com，
#                   艺人照片，国内可直连）→ iTunes（itunes.apple.com，专辑封面）。
#                   api.deezer.com 在中国大陆直连不通，所以国内实际用的是 QQ 的照片。
#   qq              只用 QQ 音乐 → iTunes，不再先试 Deezer（省掉一次超时）。
#   itunes          只用 iTunes 的专辑封面。
#   off             不联网查找，只用下面配置的 avatar_url / color，其余艺人按名字生成颜色。
#   QQ 音乐这个接口腾讯没有公开文档；用的是专辑封面时，圆形里就是那张封面，
#   主题色仍取自图里面积最大的色块。
avatars: deezer

# 艺人名与别名：同一艺人的不同写法会合并为一个艺人。
#   avatar_url  头像地址（可选）。不填时按 avatars 的设置查找；填 none 表示不要头像。
