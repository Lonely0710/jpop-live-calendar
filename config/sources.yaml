      enabled: true
      include: 'Official髭男dism|OFFICIAL HIGE DANDISM'
      keywords: [ツアー, TOUR, 公演, チケット, 受付, 先行, 抽選, 開催決定, 出演決定]
      exclude: [グッズ, GOODS, 特典, 応援店, 店舗, 販売, 予約, 配信, リリース, 放送, オンデマンド, 雑誌, 掲載, インタビュー, Blu-ray, DVD, 映像, 上映, 映画, 劇場, 公開, 完走, レポート, 振り返り, キャンペーン, アプリ]
