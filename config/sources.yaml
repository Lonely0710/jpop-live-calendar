# Live Calendar — 公开数据源与艺人别名
#
# 读取顺序（找到即用）：
#   1. 环境变量 LIVE_CALENDAR_CONFIG 指向的文件
#   2. ~/Library/Application Support/Live Calendar/sources.yaml
#   3. 当前目录下的 config/sources.yaml（开发时就是本文件）
#   4. 编译进 App 的本文件副本
#
# 只接入公开、官方的信息源：不登录、不读会员页、遵守 robots.txt 与使用条款，
# 每个站点请求间隔至少 delay（默认 2 秒）。不盲爬票务平台：票务链接只从
# 官方公告里取得，并保留回到官方公告的来源。
#
# 两层来源（见 docs/jp_live_sources_and_crawling_guide.md）：
#   layer: live   官方 LIVE / SCHEDULE 列表：发现新增演出与日程变更，每 12 小时
#   layer: news   官方 NEWS / TICKET 公告：发现抽选受付、截止、追加与变更，每 4–6 小时
#
# kind: demo | rss | website | api
#   rss      RSS 2.0 / RSS 1.0 / Atom。article.include（正则）只保留标题匹配的
#            条目，适合厂牌 NEWS 这类混有多位艺人的 feed。article.title_only 为
#            true 时先忽略 feed 自带摘要，只有打开原文页后才解析正文；max_age
#            （如 30d）跳过旧条目。article.enabled 为 true 时，标题含 keywords 的
#            条目会打开原文页，截取 body_start ~ body_end 之间的正文。
#   website  艺人官网。没有 follow 时整页作为一条公告；有 follow（正则）时，
#            该页是列表页：打开地址匹配 follow、且链接文字含 keywords
#            （以 ^ 开头表示“以此开头”）、不含 exclude 的详情页，最多 max_per_sync 页。
#            feature（正则）：从已读的页面里找到地址匹配的巡演专题页并一并读取
#            （每次最多 3 页）——巡演专题由公告链接发现，不写死在配置里。
#            artist 填写后，页面一律归属该艺人，并按“日程页”解析：
#            每个带日期的行都是一场演出，其下几行是时间、都道府县与场馆。
#   api      官网页面在浏览器里加载的公开 JSON。目前支持 Sony Music 艺人接口：
#            …/json/v2/artist/<目录>/live/…（Live 列表，日程层）与
#            …/json/v2/artist/<目录>/information/…（NEWS，公告层，可用 keywords / exclude 过滤）。
# interval: 自动同步间隔（Go duration，如 30m、6h、12h）；0 或不写表示只手动同步。
# note:     说明（显示在“数据源”页），例如为什么默认关闭。
# name / note 是界面源语言（简体中文）的写法。可选的 name_ja / name_en 与
# note_ja / note_en 是同一数据源在日文、英文界面里的写法；切换界面语言后显示
# 对应语言的那一条，没写的就显示 name / note 原文。自己新增的数据源不用写。

sources:
  - id: demo
    name: 演示数据（虚构）
    name_ja: 'デモデータ（架空）'
    name_en: 'Demo data (fictional)'
    kind: demo
    enabled: false
    interval: 0
    note: 虚构示例数据，用于体验界面；与真实数据并列显示。
    note_ja: '架空のサンプルデータ。画面を試すためのもので、実際のデータと並べて表示されます。'
    note_en: 'Fictional sample data for trying the interface; shown alongside real data.'

  # ── 米津玄師 ──
  - id: official-yonezu
    name: 米津玄師 官网 LIVE
    name_ja: '米津玄師 公式 LIVE'
    name_en: '米津玄師 Official LIVE'
    kind: website
    layer: live
    artist: 米津玄師
    url: https://reissuerecords.net/live/
    enabled: true
    interval: 12h
    follow: '^https://reissuerecords\.net/20\d\d/\d\d/\d\d/'
    article:
      keywords: [^LIVE]
      max_per_sync: 3
      delay: 2s

  - id: official-yonezu-news
    name: 米津玄師 官网 NEWS（全部资讯）
    name_ja: '米津玄師 公式 NEWS（すべて）'
    name_en: '米津玄師 Official NEWS (all news)'
    kind: website
    layer: news
    artist: 米津玄師
    url: https://reissuerecords.net/all/
    enabled: true
    interval: 6h
    follow: '^https://reissuerecords\.net/20\d\d/\d\d/\d\d/'
    article:
      keywords: [LIVE, チケット, 先行, 抽選, リセール, 公演, ツアー, TOUR]
      exclude: [MV, GOODS]
      max_per_sync: 3
      delay: 2s

