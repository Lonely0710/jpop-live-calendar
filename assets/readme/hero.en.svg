<defs><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .45 0 0 0 0 .38 0 0 0 0 .3 0 0 0 .22 0"/></filter></defs>
<style>
.stamp{transform-box:fill-box;transform-origin:center;animation:thump 3.6s ease-in-out infinite}
